<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transskription</title>
  <meta name="description" content="Dansk tale til tekst, live. Noter gemmes på enheden.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="bar">
    <button type="button" id="open-list" aria-label="Noter">☰</button>
    <div id="head">
      <input type="text" id="heading" placeholder="Overskrift" autocomplete="off" aria-label="Overskrift">
      <span id="date"></span>
    </div>
    <button type="button" id="new" aria-label="Ny note">+</button>
  </header>

  <main>
    <textarea id="text" spellcheck="false" aria-label="Notens tekst" placeholder="Tryk på start, og tal."></textarea>
    <p id="interim" aria-hidden="true"></p>
  </main>

  <section id="controls">
    <p id="info" role="status" aria-live="polite">■ Stoppet · 0 ord</p>
    <button type="button" id="mic" title="Start og stop (Ctrl+Mellemrum)">● START</button>
    <div class="row">
      <button type="button" id="copy">Kopiér alt</button>
      <button type="button" id="download" title="Download noten som .md-fil">Download</button>
      <button type="button" id="delete">Slet</button>
    </div>
    <p id="foot"><span id="version"></span></p>
  </section>

  <aside id="panel" hidden>
    <div class="panel-bar">
      <h2>Noter</h2>
      <button type="button" id="panel-new">+ Ny note</button>
      <button type="button" id="panel-close" aria-label="Luk">✕</button>
    </div>
    <ul id="list"></ul>
  </aside>
</body>
</html>
